spring.application.name=kevo-wallet-service
spring.datasource.url=jdbc:postgresql://localhost:5432/kevo_wallet?sslmode=require
spring.datasource.username=kevo_app
spring.datasource.password=${KEVO_WALLET_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/kevo_wallet?sslmode=require
spring.flyway.user=kevo_app
spring.flyway.password=${KEVO_WALLET_DB_PASSWORD}
kevo.internal-secret=${KEVO_WALLET_INTERNAL_SECRET}
kevo.webhook-secret=${KEVO_WALLET_WEBHOOK_SECRET}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-signing-secret=${STRIPE_WEBHOOK_SIGNING_SECRET:}
